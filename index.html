/div><div id="analysisSummary" class="muted"></div><div id="problems"></div></div></aside><main><div id="tabs"></div><div id="editor"></div><div id="welcome"><h1>PeaBox IDE</h1><p>Lightweight local development.</p><div><button id="open" class="primary">Open Folder</button></div><h3>Recent projects</h3><div id="recent"></div></div><section id="bottom"><div class="paneltabs"><button data-panel="terminalBox" class="active">TERMINAL</button><button data-panel="outputBox">OUTPUT</button><span></span><button id="newTerminal">＋</button><button id="closeBottom">×</button></div><div id="terminalBox" class="panel"></div><pre id="outputBox" class="panel hidden">Ready.</pre></section><footer><span id="status">Ready</span><span id="cursor">Ln 1, Col 1</span><span id="lang">Plain Text</span></footer></main></div><div id="modal" class="overlay hidden"><div class="dialog"><input id="paletteInput" placeholder="Type a command"><div id="commands"></div></div></div><div id="settingsModal" class="overlay hidden"><div class="dialog settings"><h2>Settings</h2><label><input type="checkbox" id="autoSave"> Auto Save</label><label><input type="checkbox" id="formatOnSave"> Format on Save</label><label>Font size <input type="number" id="fontSize" min="10" max="28"></label><label><input type="checkbox" id="minimap"> Minimap</label><label>Word wrap <select id="wordWrap"><option>off</option><option>on</option></select></label><label>Terminal shell <input id="terminalShell"></label><div class="row"><button id="saveSettings" class="primary">Save</button><button id="cancelSettings">Cancel</button></div></div></div><script src="./node_modules/@xterm/xterm/lib/xterm.js"></script><script src="./node_modules/@xterm/addon-fit/lib/addon-fit.js"></script><script src="renderer.js"></script></body></html>
